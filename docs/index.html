<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="theme-color" content="#f5ead8">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* — Organic design tokens (carried over from the original app) — */
@font-face { font-family: 'Caprasimo'; font-style: normal; font-weight: 400; font-display: swap;
  src: url("fonts/caprasimo-latin-ext.woff2") format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Caprasimo'; font-style: normal; font-weight: 400; font-display: swap;
  src: url("fonts/caprasimo-latin.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 400 700; font-display: swap;
  src: url("fonts/figtree-latin-ext.woff2") format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 400 700; font-display: swap;
  src: url("fonts/figtree-latin.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root {
  --color-bg: #f5ead8;
  --color-surface: #ebddc5;
  --color-text: #201e1d;
  --color-accent: #c67139;
  --color-accent-2: #7a8a5e;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-100: #f9f4ed;
  --color-neutral-200: #eee7db;
  --color-neutral-300: #dcd3c4;
  --color-neutral-400: #c0b6a5;
  --color-neutral-500: #a19786;
  --color-neutral-600: #82796a;
  --color-neutral-700: #645c50;
  --color-neutral-800: #474238;
  --color-neutral-900: #2e2b25;

  --color-accent-100: #fff2eb;
  --color-accent-200: #ffe1d0;
  --color-accent-300: #ffc6a5;
  --color-accent-400: #f6a06b;
  --color-accent-500: #d67f48;
  --color-accent-600: #b2622d;
  --color-accent-700: #8c491a;
  --color-accent-800: #643312;
  --color-accent-900: #402310;

  --color-accent-2-100: #f0fae1;
  --color-accent-2-200: #e1eecc;
  --color-accent-2-300: #ccdbb2;
  --color-accent-2-400: #aebf92;
  --color-accent-2-500: #8fa073;
  --color-accent-2-600: #728157;
  --color-accent-2-700: #56633f;
  --color-accent-2-800: #3d472b;
  --color-accent-2-900: #272e1b;

  --font-heading: "Caprasimo", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, sans-serif;

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 28px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: #ece0ca; color: var(--color-text);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
img { display: block; max-width: 100%; }
button { font-family: var(--font-body); color: var(--color-text); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

.washed { filter: saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94); }

#frame {
  height: 100dvh; max-width: 480px; margin: 0 auto; box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; background: var(--color-bg);
  position: relative; overflow: hidden;
}
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 28px 16px 110px; -webkit-overflow-scrolling: touch; }
.kicker { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-accent-700); }
.h-title { font-family: var(--font-heading); font-size: 36px; line-height: 1.1; margin-top: 2px; }
.sub { font-size: 13px; color: var(--color-neutral-600); }
.muted { color: var(--color-neutral-600); }
.card-panel { background: var(--color-neutral-100); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }

/* exercise cards on Today */
.ex-card {
  display: flex; align-items: center; gap: 12px; background: var(--color-neutral-100);
  border: none; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
  padding: 12px 12px 12px 14px; cursor: pointer; width: 100%; text-align: left; font-size: 15px;
}
.ex-thumb {
  width: 54px; height: 54px; flex: none; border-radius: var(--radius-md);
  background: #fff; border: 1px solid var(--color-divider); overflow: hidden;
}
.ex-thumb > div { width: 100%; height: 100%; background-position: center; background-size: contain; background-repeat: no-repeat; background-color: #fff; }
.pill { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.pill-green { background: var(--color-accent-2-200); color: var(--color-accent-2-800); }
.pill-orange { background: var(--color-accent-200); color: var(--color-accent-800); }
.set-circle {
  width: 46px; height: 46px; flex: none; border-radius: 999px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0;
  font-size: 12.5px; font-weight: 700;
}
.ghost-btn {
  display: inline-flex; align-items: center; gap: 4px; background: none; border: none;
  cursor: pointer; color: var(--color-accent); font-weight: 600; font-size: 13px;
  border-radius: 999px; padding: 6px 10px;
}
.ghost-btn:active { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.seg-row { display: inline-flex; border: 1px solid var(--color-divider); border-radius: 999px; overflow: hidden; }
.seg-btn { border: none; background: transparent; padding: 6px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--color-neutral-600); }
.seg-btn + .seg-btn { border-left: 1px solid var(--color-divider); }
.seg-btn.on { background: var(--color-accent); color: var(--color-bg); }

/* set logger */
.set-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 4px;
  border-bottom: 1px solid var(--color-divider); font-size: 14px;
}
.set-row:last-child { border-bottom: none; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button {
  width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid var(--color-divider);
  background: var(--color-neutral-100); cursor: pointer; display: flex; align-items: center;
  justify-content: center; padding: 0; flex: none; font-size: 20px;
}
.stepper button:active { background: var(--color-neutral-200); }
.stepper input {
  width: 64px; text-align: center; font-family: var(--font-heading); font-size: 22px;
  border: none; background: transparent; color: var(--color-text); padding: 0;
  -moz-appearance: textfield; appearance: textfield;
}
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.big-btn {
  width: 100%; border-radius: 999px; padding: 14px; font-size: 15px; font-weight: 600;
  border: none; cursor: pointer; background: var(--color-accent); color: var(--color-bg);
  font-family: var(--font-body);
}
.big-btn:active { background: var(--color-accent-600); }
.big-btn.done { background: var(--color-accent-2-500); }
.icon-btn { background: none; border: none; cursor: pointer; padding: 8px; display: flex; color: var(--color-neutral-500); }

/* progress chips */
.chip-row { display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--color-divider); background: var(--color-neutral-100);
  border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  color: var(--color-neutral-700);
}
.chip.on { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-bg); }

.text-input {
  width: 100%; min-height: 44px; padding: 8px 16px; font: inherit; font-size: 14px;
  color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-neutral-100); border: 1.5px solid var(--color-divider); border-radius: 999px;
}
.text-input:focus-visible { border-color: var(--color-accent); outline: none; }

/* bottom nav */
#nav {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: color-mix(in srgb, var(--color-bg) 88%, #fff);
  backdrop-filter: blur(10px); border-top: 1px solid var(--color-divider);
  display: flex; padding: 8px 10px calc(14px + env(safe-area-inset-bottom)); z-index: 20;
}
#nav button {
  flex: 1; background: none; border: none; cursor: pointer; display: flex;
  flex-direction: column; align-items: center; gap: 3px; padding: 4px 0;
}
#nav button span { font-size: 10.5px; font-weight: 600; }

/* toast */
.toast {
  position: absolute; bottom: 104px; left: 50%; transform: translateX(-50%);
  background: var(--color-accent-2-800); color: var(--color-accent-2-100);
  font-size: 13px; font-weight: 600; padding: 10px 12px 10px 18px; border-radius: 999px;
  box-shadow: var(--shadow-md); animation: toastup 0.25s ease-out; white-space: nowrap;
  z-index: 30; display: flex; align-items: center; gap: 8px;
}
.toast button {
  background: color-mix(in srgb, #fff 16%, transparent); color: var(--color-accent-2-100);
  border: none; border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
@keyframes toastup { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* zoom overlay */
.zoom-wrap {
  position: absolute; inset: 0; z-index: 40;
  background: color-mix(in srgb, var(--color-neutral-900) 82%, transparent);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 24px 16px; cursor: zoom-out; animation: toastup 0.2s ease-out;
}

/* dialog */
.dialog-backdrop {
  position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px;
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px;
  padding: 20px; border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--shadow-lg);
}

/* chart */
.chart-svg { width: 100%; height: auto; display: block; }
.chart-svg text { font-family: var(--font-body); }
</style>
</head>
<body>
<div id="frame">
  <div id="app" style="display: flex; flex-direction: column; flex: 1; min-height: 0;"></div>
  <div id="overlay"></div>
  <div id="nav"></div>
  <input type="file" id="importFile" accept="application/json,.json" style="display: none;">
</div>

<script>
'use strict';

/* ───────────────────────── Program definition ───────────────────────── */

const EX = {
  pullup: {
    name: 'Pull-ups', day: 'pull', sets: 3, reps: 'Max', repDefault: 8, kg: null,
    m: 'Lats · biceps', mus: { p: ['lats'], s: ['biceps', 'midback'] },
    desc: 'The best back-width move — lats do the pulling, biceps and grip assist. Take every set close to your max.',
    how: ['Hang from the bar, hands just wider than shoulders.',
      'Pull until your chin clears the bar, chest up.',
      'Lower all the way down — full hang each rep.'],
  },
  row: {
    name: 'One-Arm Dumbbell Row', day: 'pull', sets: 3, reps: '8–12 / arm', repDefault: 10, kg: 16,
    m: 'Lats · mid-back', mus: { p: ['lats', 'midback'], s: ['biceps', 'forearms'] },
    desc: 'Builds back thickness one side at a time. Brace your free hand on the ottoman and row without twisting. Log reps per arm.',
    how: ['One knee and hand on the ottoman, back flat, dumbbell hanging.',
      'Pull the dumbbell to your hip, elbow close to your body.',
      'Lower slowly to a full stretch. Do all reps, then switch arms.'],
  },
  hammer: {
    name: 'Hammer Curls', day: 'pull', sets: 3, reps: '10–12', repDefault: 11, kg: 11.5,
    m: 'Biceps · forearms', mus: { p: ['biceps'], s: ['forearms'] },
    desc: 'Neutral-grip curls that hit the brachialis and forearms along with the biceps — thicker-looking arms.',
    how: ['Stand tall, dumbbells at your sides, palms facing in.',
      'Curl both dumbbells up, keeping the neutral grip.',
      'Lower slowly without swinging your hips.'],
  },
  conc: {
    name: 'Concentration Curls', day: 'pull', sets: 3, reps: '8–12', repDefault: 10, kg: 11.5,
    m: 'Biceps', mus: { p: ['biceps'], s: ['forearms'] },
    desc: 'Strict, isolated biceps work — the elbow braced against your thigh removes all momentum.',
    how: ['Sit on the ottoman, elbow braced against your inner thigh.',
      'Curl the dumbbell up without moving your upper arm.',
      'Lower slowly — the way down builds as much muscle.'],
  },
  floorpress: {
    name: 'Dumbbell Floor Press', day: 'push', sets: 3, reps: '8–12', repDefault: 10, kg: 14,
    m: 'Chest · triceps', mus: { p: ['chest'], s: ['triceps', 'shoulders'] },
    desc: 'Your main press without a bench — the floor stops the elbows at a shoulder-friendly depth and emphasises chest and triceps.',
    how: ['Lie on the floor, knees bent, dumbbells over your chest.',
      'Lower with control until your upper arms rest on the floor.',
      'Pause briefly, then press back up to lockout.'],
  },
  inclinepu: {
    name: 'Incline Push-ups', day: 'push', sets: 3, reps: '12–15', repDefault: 13, kg: null,
    m: 'Chest · shoulders', mus: { p: ['chest'], s: ['shoulders', 'triceps', 'core'] },
    desc: 'Hands on the ottoman, feet on the floor — a chest press through a long range that finishes the pecs after floor presses.',
    how: ['Hands on the ottoman edge, body in one straight line.',
      'Lower your chest to the edge, elbows about 45° from your body.',
      'Press back up without letting the hips sag.'],
  },
  ohp: {
    name: 'Overhead Press', day: 'push', sets: 3, reps: '8–12', repDefault: 10, kg: 11.5,
    m: 'Shoulders · triceps', mus: { p: ['shoulders'], s: ['triceps', 'traps', 'core'] },
    desc: 'Standing dumbbell press — builds all three heads of the shoulder while your core keeps you from arching.',
    how: ['Stand tall, dumbbells at ear height, palms forward.',
      'Press overhead until your arms are straight — squeeze your glutes, don’t arch.',
      'Lower back to ear level with control.'],
  },
  latraise: {
    name: 'Lateral Raises', day: 'push', sets: 3, reps: '12–15', repDefault: 13, kg: 6,
    m: 'Side delts', mus: { p: ['shoulders'], s: ['traps'] },
    desc: 'Isolates the side delts — the muscle that makes shoulders look wide. Light weight, strict form.',
    how: ['Stand with a dumbbell in each hand at your sides.',
      'Raise out to shoulder height, elbows soft.',
      'Lower slowly — no swinging.'],
  },
  kneeraise: {
    name: 'Hanging Knee Raises', day: 'push', sets: 3, reps: '10–15', repDefault: 12, kg: null,
    m: 'Core · grip', mus: { p: ['core'], s: ['forearms'] },
    desc: 'Hang from the pull-up bar and curl your knees up — trains the abs hard and builds grip as a bonus.',
    how: ['Dead hang from the bar, shoulders packed down.',
      'Raise your knees to hip height or higher, tilting the pelvis up.',
      'Lower slowly — no swinging between reps.'],
  },
};

const PLAN = {
  pull: ['pullup', 'row', 'hammer', 'conc'],
  push: ['floorpress', 'inclinepu', 'ohp', 'latraise', 'kneeraise'],
};
const DAY_LABEL = { pull: 'Pull day', push: 'Push day', rest: 'Rest day', other: 'Custom day' };

/* Resolve an exercise id to a definition. Built-ins come from EX; anything
   else (added by the coach GPT or an import) falls back to store.customEx,
   then to a safe generic definition so unknown ids can never crash a render. */
function prettyName(id) {
  return id.charAt(0).toUpperCase() + id.slice(1).replace(/[-_]+/g, ' ');
}
function getEx(id) {
  if (EX[id]) return EX[id];
  const base = {
    name: prettyName(id), day: 'other', sets: 3, reps: '', repDefault: 10,
    kg: null, m: 'Custom', mus: null, desc: '', how: [], custom: true,
  };
  const c = store.customEx && store.customEx[id];
  if (c) {
    for (const k of ['name', 'day', 'sets', 'reps', 'repDefault', 'kg', 'm', 'desc']) {
      if (c[k] != null) base[k] = c[k];
    }
    if (!DAY_LABEL[base.day]) base.day = 'other';
    if (c.mus && (Array.isArray(c.mus.p) || Array.isArray(c.mus.s))) base.mus = { p: c.mus.p || [], s: c.mus.s || [] };
    if (Array.isArray(c.how)) base.how = c.how.filter((t) => typeof t === 'string');
    base.img0 = safeImg(c.img0);
    base.img1 = safeImg(c.img1);
  }
  // If it was ever logged with a weight, treat it as a weighted exercise.
  if (base.kg == null && exHistory(id).some((h) => h.sets.some((s) => s.kg != null))) base.kg = 0;
  return base;
}
/* Image URLs from the gist are untrusted — accept only plain https URLs. */
function safeImg(u) {
  return (typeof u === 'string' && /^https:\/\/[^\s"'()<>\\]+$/i.test(u)) ? u : null;
}
/* Photo for an exercise: bundled file for built-ins, remote URL for customs. */
function exImg(id, n) {
  const ex = getEx(id);
  if (!ex.custom) return 'images/' + id + '-' + n + '.jpg';
  return ex['img' + n] || null;
}
/* Custom exercise ids that appear anywhere in the log. */
function customExIds() {
  const ids = new Set(Object.keys((store.customEx) || {}));
  for (const d of workoutDates()) for (const id of Object.keys(store.sessions[d].sets)) {
    if (!EX[id]) ids.add(id);
  }
  return [...ids];
}
const KG_STEP = 0.5;
const WEEK_TARGET = 3; // workouts per week the ring aims at

/* ───────────────────────── Store (localStorage) ───────────────────────── */

const STORE_KEY = 'gym-tracker-v1';

function seedStore() {
  return {
    version: 1,
    sessions: {
      '2026-08-17': {
        day: 'pull',
        sets: {
          pullup: [{ r: 8, kg: null }, { r: 8, kg: null }, { r: 8, kg: null }],
          row: [{ r: 15, kg: 16 }, { r: 15, kg: 16 }, { r: 13, kg: 16 }],
          hammer: [{ r: 12, kg: 11.5 }, { r: 12, kg: 11.5 }, { r: 12, kg: 11.5 }],
          conc: [{ r: 8, kg: 11.5 }, { r: 8, kg: 11.5 }, { r: 8, kg: 11.5 }],
        },
      },
    },
    overrides: {}, // date -> forced day type
    customEx: {},  // extra exercise definitions (coach GPT / imports)
  };
}

let store;
try {
  store = JSON.parse(localStorage.getItem(STORE_KEY)) || seedStore();
} catch (e) { store = seedStore(); }
if (!store.sessions) store.sessions = {};
if (!store.overrides) store.overrides = {};
if (!store.customEx) store.customEx = {};

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
save();

/* Cloud backup settings (GitHub Gist). Token stays on this device only. */
const CLOUD_KEY = 'gym-tracker-cloud';
let cloud;
try { cloud = JSON.parse(localStorage.getItem(CLOUD_KEY)) || {}; } catch (e) { cloud = {}; }
function saveCloud() { localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud)); }

/* Coach chat settings (Anthropic API). Key stays on this device only. */
const COACH_KEY = 'gym-tracker-coach';
const CHAT_KEY = 'gym-tracker-chat';
const COACH_MODEL = 'claude-opus-5';
let coach, chat;
try { coach = JSON.parse(localStorage.getItem(COACH_KEY)) || {}; } catch (e) { coach = {}; }
try { chat = JSON.parse(localStorage.getItem(CHAT_KEY)) || []; } catch (e) { chat = []; }
if (!Array.isArray(chat)) chat = [];
function saveCoach() { localStorage.setItem(COACH_KEY, JSON.stringify(coach)); }
function saveChat() { localStorage.setItem(CHAT_KEY, JSON.stringify(chat)); }

/* ───────────────────────── Date helpers (local time) ───────────────────────── */

function fmtDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function todayStr() { return fmtDate(new Date()); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); }
function mondayOf(s) { const d = parseDate(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return fmtDate(d); }
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WDAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
function niceDate(s) { const d = parseDate(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function weekdayName(s) { return WDAYS[(parseDate(s).getDay() + 6) % 7]; }

/* ───────────────────────── Log queries ───────────────────────── */

function sessionOf(date) { return store.sessions[date]; }
function setsOf(date, exId) { const s = sessionOf(date); const a = s && s.sets && s.sets[exId]; return Array.isArray(a) ? a : []; }
function isWorkout(sess) {
  return sess && sess.sets && Object.values(sess.sets).some((arr) => arr.length > 0);
}
function workoutDates() {
  return Object.keys(store.sessions).filter((d) => isWorkout(store.sessions[d])).sort();
}
function lastWorkoutBefore(date) {
  const ds = workoutDates().filter((d) => d < date);
  return ds.length ? ds[ds.length - 1] : null;
}
// Sessions that logged sets for one exercise, oldest → newest.
function exHistory(exId) {
  return workoutDates()
    .map((d) => ({ date: d, sets: setsOf(d, exId) }))
    .filter((h) => h.sets.length > 0);
}
function lastSetsFor(exId, beforeDate) {
  const hist = exHistory(exId).filter((h) => h.date < beforeDate);
  return hist.length ? hist[hist.length - 1] : null;
}
function lastKg(exId, beforeDate) {
  const prev = lastSetsFor(exId, beforeDate || '9999');
  if (prev) { for (let i = prev.sets.length - 1; i >= 0; i--) { if (prev.sets[i].kg != null) return prev.sets[i].kg; } }
  const kg = getEx(exId).kg;
  return kg === 0 ? null : kg;
}

/* Day type for a date: logged session > manual override > rotation suggestion.
   Suggestions chain forward from the last real workout, alternating push/pull
   with a rest day in between, so future days project the full rotation. */
function dayType(date) {
  const sess = sessionOf(date);
  if (isWorkout(sess)) return sess.day;
  if (store.overrides[date]) return store.overrides[date];
  const last = lastWorkoutBefore(date);
  if (!last) return 'push';
  let lw = last, lt = store.sessions[last].day;
  if (lt !== 'push' && lt !== 'pull') {
    // Custom day (e.g. legs) — alternate from the most recent push/pull instead.
    const ds = workoutDates().filter((d) => d < date);
    for (let i = ds.length - 1; i >= 0; i--) {
      const t = store.sessions[ds[i]].day;
      if (t === 'push' || t === 'pull') { lt = t; break; }
    }
    if (lt !== 'push' && lt !== 'pull') lt = 'pull';
  }
  let d = addDays(last, 1), guard = 0;
  while (d < date && guard++ < 90) {
    const t = store.overrides[d] || (d === addDays(lw, 1) ? 'rest' : (lt === 'pull' ? 'push' : 'pull'));
    if (t !== 'rest') { lw = d; lt = t; }
    d = addDays(d, 1);
  }
  return date === addDays(lw, 1) ? 'rest' : (lt === 'pull' ? 'push' : 'pull');
}

/* Exercises shown for a date: the day plan, unfinished ones rolled over from
   the previous workout (never onto rest days), plus anything already logged
   that day so recorded sets can never become invisible. */
function dayItems(date) {
  const type = dayType(date);
  const ids = (PLAN[type] || []).map((id) => ({ id, rolled: null }));
  const last = type !== 'rest' ? lastWorkoutBefore(date) : null;
  if (last) {
    const lastType = store.sessions[last].day;
    for (const id of PLAN[lastType] || []) {
      if (ids.some((it) => it.id === id)) continue;
      if (setsOf(last, id).length === 0) ids.push({ id, rolled: 'from ' + weekdayName(last).slice(0, 3) + ' ' + niceDate(last) });
    }
  }
  const sess = sessionOf(date);
  if (sess && sess.sets) {
    for (const id of Object.keys(sess.sets)) {
      if (!ids.some((it) => it.id === id)) ids.push({ id, rolled: null });
    }
  }
  return ids;
}
function exDone(date, exId) { return setsOf(date, exId).length >= getEx(exId).sets; }

/* ───────────────────────── Mutations ───────────────────────── */

function logSet(date, exId, r, kg) {
  const sess = store.sessions[date] || (store.sessions[date] = { day: dayType(date) === 'rest' ? getEx(exId).day : dayType(date), sets: {} });
  if (!sess.sets) sess.sets = {};
  if (sess.day === 'rest') sess.day = getEx(exId).day;
  (sess.sets[exId] = sess.sets[exId] || []).push({ r, kg });
  save();
}
function removeSet(date, exId, idx) {
  const sets = setsOf(date, exId);
  if (idx < 0 || idx >= sets.length) return;
  sets.splice(idx, 1);
  const sess = store.sessions[date];
  if (sets.length === 0) delete sess.sets[exId];
  if (!isWorkout(sess) && Object.keys(sess.sets).length === 0) delete store.sessions[date];
  save();
}
function updateSet(date, exId, idx, r, kg) {
  const sets = setsOf(date, exId);
  if (sets[idx]) { sets[idx] = { r, kg }; save(); }
}

}

/* ───────────────────────── Formatting ───────────────────────── */

function kgLabel(kg) { return kg == null ? 'BW' : (Math.round(kg * 10) / 10) + ' kg'; }
function setsSummary(sets) {
  if (!sets.length) return '';
  const reps = sets.map((s) => s.r).join(' · ');
  const kgs = [...new Set(sets.map((s) => s.kg))];
  const kgPart = kgs.length === 1 ? (kgs[0] == null ? 'bodyweight' : kgs[0] + ' kg') : sets.map((s) => kgLabel(s.kg)).join(' / ');
  return reps + ' @ ' + kgPart;
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  const date = ui.viewDate;
  const type = dayType(date);
  const isToday = date === todayStr();
  const items = dayItems(date);
  const doneCount = items.filter((it) => exDone(date, it.id)).length;
  const title = isToday ? weekdayName(date) : weekdayName(date) + ' ' + niceDate(date);
  const kicker = (isToday ? '' : niceDate(date) + ' · ') + DAY_LABEL[type];

  let cards = items.map((it) => {
    const ex = getEx(it.id);
    const sets = setsOf(date, it.id);
    const done = sets.length >= ex.sets;
    const kg = lastKg(it.id, date);
    const meta = done ? setsSummary(sets) : ex.sets + ' × ' + (ex.reps || '?') + ' · ' + kgLabel(ex.kg == null ? null : kg);
    const border = done ? 'var(--color-accent)' : 'var(--color-neutral-400)';

    return '<div class="ex-card" data-act="open" data-id="' + it.id + '" style="opacity: ' + (done ? 0.62 : 1) + ';">' +
      '<div class="ex-thumb">' + thumb + '</div>' +

      '<div style="font-size: 12.5px; color: var(--color-neutral-600); margin-top: 2px;">' + meta + '</div>' +
      '<div style="display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap;">' +
      '<span class="pill pill-green">' + esc(ex.m) + '</span>' +
      (it.rolled ? '<span class="pill pill-orange">↳ ' + it.rolled + '</span>' : '') +
      '</div></div>' +
      '<button class="set-circle" data-act="quickset" data-id="' + it.id + '" aria-label="Log a set" ' +
      'style="border: 2.5px solid ' + border + '; background: ' + bg + '; color: var(--color-neutral-700);">' + inner + '</button>' +
      '</div>';
  }).join('');

  if (!items.length) {
    cards = '<div class="card-panel" style="padding: 26px 20px; text-align: center;">' +
      '<div style="font-family: var(--font-heading); font-size: 22px;">Rest day</div>' +
      '<div class="sub" style="margin-top: 6px;">Recovery is where the muscle gets built.<br>Feeling fresh anyway? Switch the day type below.</div></div>';
  }

  const seg = ['push', 'pull', 'rest'].map((t) =>
    '<button class="seg-btn' + (t === type ? ' on' : '') + '" data-act="daytype" data-type="' + t + '">' +
    t[0].toUpperCase() + t.slice(1) + '</button>').join('');

  const totalSets = items.reduce((n, it) => n + setsOf(date, it.id).length, 0);
  const countLabel = items.length
    ? doneCount + ' of ' + items.length + ' exercises · ' + totalSets + ' sets logged'
    : 'No training planned';

  return '<div class="screen" data-scrollkey="today">' +
    '<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 4px;">' +
    '<div><div class="kicker">' + kicker + '</div><div class="h-title">' + title + '</div></div>' +

function renderWeek() {
  const monday = addDays(mondayOf(todayStr()), ui.weekOffset * 7);
  const sunday = addDays(monday, 6);
  let done = 0, planned = 0;
  const rows = [];
  for (let i = 0; i < 7; i++) {
    const date = addDays(monday, i);
    const isToday = date === todayStr();
    const future = date > todayStr();
    const sess = sessionOf(date);
    const logged = isWorkout(sess);
    const type = dayType(date);
    const items = (logged || isToday || future) && type !== 'rest' ? dayItems(date) : [];
    const dn = items.filter((it) => exDone(date, it.id)).length;
    if (!future && items.length) { done += dn; planned += items.length; }
    const missed = !logged && !isToday && !future && type !== 'rest';
    const label = type === 'rest' ? 'Rest' : (missed ? 'No training' : DAY_LABEL[type].replace(' day', '') + ' · ' + items.length + ' exercises');
    const sub = weekdayName(date) + ' · ' + niceDate(date) +
      (logged ? ' · ' + Object.values(sess.sets).reduce((n, a) => n + a.length, 0) + ' sets' : (future && type !== 'rest' ? ' · planned' : ''));
    const full = items.length > 0 && dn === items.length;
    const abbr = weekdayName(date).slice(0, 2);
    rows.push(
      '<div data-act="openday" data-date="' + date + '" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--radius-lg); cursor: pointer;' +
      ' background: ' + (isToday ? 'var(--color-neutral-100)' : 'transparent') + ';' +
      ' border: 2px solid ' + (isToday ? 'var(--color-accent)' : (type === 'rest' || missed ? 'transparent' : 'var(--color-divider)')) + ';' +
      ' opacity: ' + (type === 'rest' || missed ? 0.6 : (future ? 0.75 : 1)) + ';">' +
      '<div style="width: 42px; height: 42px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-size: 15px;' +
      ' background: ' + (full ? 'var(--color-accent-2-500)' : (type === 'rest' || missed ? 'var(--color-neutral-200)' : 'var(--color-surface)')) + ';' +
      ' color: ' + (full ? '#fff' : (type === 'rest' || missed ? 'var(--color-neutral-500)' : 'var(--color-text)')) + ';">' + abbr + '</div>' +
      '<div style="flex: 1; min-width: 0;"><div style="font-weight: 600; font-size: 15px;">' + label + '</div>' +
      '<div style="font-size: 12px; color: var(--color-neutral-600); margin-top: 1px;">' + sub + '</div></div>' +
      (items.length && !future ?
        '<div style="width: 64px; flex: none;">' +
        '<div style="height: 7px; border-radius: 999px; background: var(--color-neutral-300); overflow: hidden;">' +
        '<div style="height: 100%; border-radius: 999px; background: ' + (full ? 'var(--color-accent-2-500)' : 'var(--color-accent)') + '; width: ' + Math.round((dn / items.length) * 100) + '%;"></div></div>' +
        '<div style="font-size: 10.5px; color: var(--color-neutral-600); text-align: right; margin-top: 3px;">' + dn + ' / ' + items.length + '</div></div>' : '') +
      '</div>');
  }
  const weekNum = (function (d) {
    const t = parseDate(d); t.setDate(t.getDate() + 3);
    const jan1 = new Date(t.getFullYear(), 0, 1);
    return Math.ceil(((t - jan1) / 864e5 + 1) / 7);
  })(monday);

  return '<div class="screen" data-scrollkey="week">' +
    '<div style="display: flex; align-items: center; justify-content: space-between;">' +
    '<div><div class="kicker">' + niceDate(monday) + ' – ' + niceDate(sunday) + '</div>' +
    '<div class="h-title">Week ' + weekNum + '</div></div>' +
    '<div style="display: flex; gap: 4px;">' +
    '<button class="ghost-btn" data-act="weeknav" data-dir="-1" aria-label="Previous week" style="font-size: 18px;">‹</button>' +
    '<button class="ghost-btn" data-act="weeknav" data-dir="1" aria-label="Next week" style="font-size: 18px;"' + (ui.weekOffset >= 0 ? ' disabled' : '') + '>›</button>' +
    '</div></div>' +
    '<div class="sub" style="margin: 2px 0 16px;">' + (planned ? done + ' of ' + planned + ' exercises done' : 'Nothing logged yet this week') + '</div>' +
    '<div style="display: flex; flex-direction: column; gap: 8px;">' + rows.join('') + '</div>' +
    '<div style="display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; color: var(--color-neutral-600); padding: 0 4px;">' +
    svgArrow + '<span>Push and pull alternate with a rest day between when possible. Missed exercises roll into your next session.</span></div>' +
    '</div>';
}

/* — Progress helpers — */

function weekWorkouts(mondayStr) {
  let n = 0;
  for (let i = 0; i < 7; i++) if (isWorkout(sessionOf(addDays(mondayStr, i)))) n++;
  return n;
}
function streakWeeks() {
  let streak = 0;
  let m = mondayOf(todayStr());
  if (weekWorkouts(m) >= 2) streak++;
  m = addDays(m, -7);
  while (weekWorkouts(m) >= 2) { streak++; m = addDays(m, -7); }
  return streak;
}

/* Single-series line chart of an exercise's history. Weighted exercises plot
   top-set weight; bodyweight ones plot total reps. */
function historyChart(exId) {
  const ex = getEx(exId);
  const hist = exHistory(exId);
  const bw = ex.kg == null;
  const pts = hist.map((h) => ({
    date: h.date, sets: h.sets,
    v: bw ? h.sets.reduce((n, s) => n + s.r, 0) : Math.max(...h.sets.map((s) => s.kg == null ? 0 : s.kg)),
  }));
  const unit = bw ? 'reps' : 'kg';
  const metric = bw ? 'Total reps' : 'Top-set weight';

  if (!pts.length) {
    return '<div class="sub" style="padding: 26px 10px; text-align: center;">Nothing logged for ' + ex.name + ' yet.</div>';
  }
  if (ui.chartPt != null && ui.chartPt >= pts.length) ui.chartPt = null;
  const sel = ui.chartPt != null ? ui.chartPt : pts.length - 1;

  const W = 340, H = 200, mL = 38, mR = 16, mT = 18, mB = 34;
  const iw = W - mL - mR, ih = H - mT - mB;
  let lo = Math.min(...pts.map((p) => p.v)), hi = Math.max(...pts.map((p) => p.v));
  if (lo === hi) { lo -= Math.max(1, lo * 0.15); hi += Math.max(1, hi * 0.15); }
  const pad = (hi - lo) * 0.15; lo = Math.max(0, lo - pad); hi += pad;
  // 3 nice tick values
  const ticks = [0, 0.5, 1].map((f) => lo + (hi - lo) * f).map((v) => Math.round(v * 2) / 2);
  const x = (i) => pts.length === 1 ? mL + iw / 2 : mL + (i / (pts.length - 1)) * iw;
  const y = (v) => mT + ih - ((v - lo) / (hi - lo)) * ih;

  const grid = ticks.map((v) =>
    '<line x1="' + mL + '" y1="' + y(v) + '" x2="' + (W - mR) + '" y2="' + y(v) + '" stroke="#e5ddd0" stroke-width="1"/>' +
    '<text x="' + (mL - 6) + '" y="' + (y(v) + 3.5) + '" text-anchor="end" font-size="10" fill="#82796a">' + (Math.round(v * 10) / 10) + '</text>').join('');

  // Date labels: first (start-anchored), last (end-anchored), and evenly
  // spaced ones between that keep clear of both ends.
  const labelEvery = Math.max(1, Math.ceil(pts.length / 4));
  const xlabels = pts.map((p, i) => {
    const isFirst = i === 0, isLast = i === pts.length - 1;
    const isMid = !isFirst && !isLast && i % labelEvery === 0 && i >= labelEvery && (pts.length - 1 - i) >= labelEvery;
    if (!isFirst && !isLast && !isMid) return '';
    const anchor = isFirst && pts.length > 1 ? 'start' : (isLast && pts.length > 1 ? 'end' : 'middle');
    const tx = isFirst && pts.length > 1 ? mL - 8 : (isLast && pts.length > 1 ? W - 2 : x(i));
    return '<text x="' + tx + '" y="' + (H - 8) + '" text-anchor="' + anchor + '" font-size="10" fill="#82796a">' + niceDate(p.date) + '</text>';
  }).join('');

  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const dots = pts.map((p, i) =>
    '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="' + (i === sel ? 6 : 4) + '" fill="var(--color-accent)" stroke="var(--color-neutral-100)" stroke-width="2"/>').join('');
  const hits = pts.map((p, i) =>
    '<rect data-act="chartpt" data-idx="' + i + '" x="' + (x(i) - Math.min(22, iw / pts.length / 2)) + '" y="0" width="' + Math.min(44, iw / Math.max(1, pts.length - 1)) + '" height="' + H + '" fill="transparent" style="cursor: pointer;"/>').join('');

  const s = pts[sel];
  const detail =
    '<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 9px 12px; border-radius: var(--radius-md); background: var(--color-neutral-200);">' +
    '<div style="font-size: 12.5px;"><b>' + weekdayName(s.date).slice(0, 3) + ' ' + niceDate(s.date) + '</b>' +
    '<span class="muted"> · ' + setsSummary(s.sets) + '</span></div>' +
    '<div style="font-family: var(--font-heading); font-size: 17px; flex: none;">' + (Math.round(s.v * 10) / 10) + ' ' + unit + '</div></div>';

  const single = pts.length === 1
    ? '<div class="sub" style="text-align: center; margin-top: 4px;">One session logged — the trend appears as you add more.</div>' : '';

  return '<div class="sub" style="margin-bottom: 2px;">' + metric + ' (' + unit + ')</div>' +
    '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '">' +
    grid + xlabels +
    '<path d="' + path + '" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + hits + '</svg>' + detail + single;
}

function renderProgress() {
  const monday = mondayOf(todayStr());
  const thisWeek = weekWorkouts(monday);
  const streak = streakWeeks();

  // six-week bars (workouts per week)
  const weeks = [];
  for (let i = 5; i >= 0; i--) {
    const m = addDays(monday, -7 * i);
    weeks.push({ m, n: weekWorkouts(m), now: i === 0 });
  }
  const maxN = Math.max(4, ...weeks.map((w) => w.n));
  const bars = weeks.map((w) => {
    const h = Math.max(4, Math.round((w.n / maxN) * 62));
    return '<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end;">' +
      '<div style="font-size: 10.5px; font-weight: 600; color: var(--color-neutral-600);">' + w.n + '</div>' +
      '<div style="width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px; background: ' + (w.now ? 'var(--color-accent-600)' : 'var(--color-accent-400)') + '; height: ' + h + 'px;"></div>' +
      '<div style="font-size: 10.5px; color: var(--color-neutral-600);' + (w.now ? ' font-weight: 700;' : '') + '">' + (w.now ? 'now' : niceDate(w.m)) + '</div></div>';
  }).join('');

  const chips = [...PLAN.pull, ...PLAN.push, ...customExIds()].map((id) =>
    '<button class="chip' + (ui.chartEx === id ? ' on' : '') + '" data-act="chartex" data-id="' + id + '">' + esc(getEx(id).name) + '</button>').join('');

  const hist = exHistory(ui.chartEx).slice(-8).reverse();
  const recent = hist.map((h) =>
    '<div style="display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--color-divider); font-size: 13px;">' +
    '<div style="flex: none; width: 62px;" class="muted">' + niceDate(h.date) + '</div>' +
    '<div style="flex: 1;">' + setsSummary(h.sets) + '</div></div>').join('');

  return '<div class="screen" data-scrollkey="progress">' +
    '<div class="h-title" style="margin-top: 0;">Progress</div>' +
    '<div class="sub" style="margin: 2px 0 20px;">Updates live as you log sets</div>' +

/* ───────────────────────── Actions ───────────────────────── */

function readNum(id, fallback) {
  const el = document.getElementById(id);
  if (!el) return fallback;
  const v = parseFloat(el.value);
  return isNaN(v) || v < 0 ? fallback : v;
}

function currentEditorValues(exId) {
  const ex = getEx(exId);
  const r = Math.round(readNum('inp-reps', ex.repDefault));
  const kg = ex.kg == null ? null : readNum('inp-kg', lastKg(exId, ui.viewDate));
  return { r: Math.max(1, r), kg };
}

document.getElementById('frame').addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const date = ui.viewDate;

  if (act === 'noop') { e.stopPropagation(); return; }

  switch (act) {
    case 'nav':
      ui.screen = t.dataset.screen;
      if (ui.screen === 'today') { ui.viewDate = todayStr(); ui.detailId = null; }
      ui.editIdx = null;
      break;
    case 'open':
      ui.detailId = t.dataset.id; ui.screen = 'detail'; ui.editIdx = null;
      scrollPos.detail = 0;
      break;
    case 'quickset': {
      e.stopPropagation();
      const id = t.dataset.id, ex = getEx(id);
      const sets = setsOf(date, id);
      if (sets.length >= ex.sets) { ui.detailId = id; ui.screen = 'detail'; ui.editIdx = null; scrollPos.detail = 0; break; }
      const prev = lastSetsFor(id, date);
      const idx = sets.length;
      const r = prev && prev.sets[idx] ? prev.sets[idx].r : (sets.length ? sets[sets.length - 1].r : ex.repDefault);
      const kg = ex.kg == null ? null : lastKg(id, date);
      logSet(date, id, r, kg);
      showToast('Set ' + (idx + 1) + ' · ' + r + ' reps · ' + kgLabel(kg), () => removeSet(date, id, idx));
      return; // showToast rendered already
    }
    case 'backtoday': ui.viewDate = todayStr(); break;
    case 'daytype': {
      const type = t.dataset.type;
      const sess = sessionOf(date);
      if (isWorkout(sess)) {
        if (type !== 'rest') { sess.day = type; save(); }
      } else { store.overrides[date] = type; save(); }
      break;
    }
    case 'backfromdetail': ui.screen = 'today'; ui.detailId = null; ui.editIdx = null; break;
    case 'step': {
      const inp = document.getElementById(t.dataset.input);
      if (inp) {
        const step = parseFloat(t.dataset.delta);
        const v = Math.max(0, (parseFloat(inp.value) || 0) + step);
        inp.value = Math.round(v * 10) / 10;
      }
      return; // no re-render — keep keyboard/scroll state
    }
    case 'logset': {
      const { r, kg } = currentEditorValues(ui.detailId);
      logSet(date, ui.detailId, r, kg);
      break;
    }
    case 'editset': ui.editIdx = parseInt(t.dataset.idx, 10); break;
    case 'canceledit': ui.editIdx = null; break;
    case 'saveedit': {
      const { r, kg } = currentEditorValues(ui.detailId);
      updateSet(date, ui.detailId, ui.editIdx, r, kg);
      ui.editIdx = null;
      break;
    }
    case 'delset': {
      e.stopPropagation();
      const idx = parseInt(t.dataset.idx, 10);
      const removed = setsOf(date, ui.detailId)[idx];
      removeSet(date, ui.detailId, idx);
      if (ui.editIdx != null) ui.editIdx = null;
      showToast('Removed set ' + (idx + 1), () => {
        const sets = setsOf(date, ui.detailId);
        logSet(date, ui.detailId, removed.r, removed.kg);
        // put it back where it was
        const arr = setsOf(date, ui.detailId); arr.splice(idx, 0, arr.pop()); save();
      });
      return;
    }
    case 'zoom': e.stopPropagation(); ui.zoom = parseInt(t.dataset.n, 10); break;
    case 'zoomswap': e.stopPropagation(); ui.zoom = ui.zoom === 0 ? 1 : 0; break;
    case 'zoomclose': ui.zoom = null; break;
    case 'openday': ui.viewDate = t.dataset.date; ui.screen = 'today'; break;
    case 'weeknav': {
      const next = ui.weekOffset + parseInt(t.dataset.dir, 10);
      if (next <= 0) ui.weekOffset = next;
      break;
    }
    case 'chartex': ui.chartEx = t.dataset.id; ui.chartPt = null; break;
    case 'chartpt': ui.chartPt = parseInt(t.dataset.idx, 10); break;
    case 'export': doExport(); return;
    case 'import': document.getElementById('importFile').click(); return;
    case 'cloudconnect': {
      const inp = document.getElementById('inp-token');
      const token = inp && inp.value.trim();
      if (!token) { showToast('Paste a token first'); return; }
      cloud.token = token; saveCloud();
      break;
    }
    case 'cloudsave': cloudSave(); return;
    case 'cloudrestore': cloudRestore(); return;
    case 'clouddisconnect': cloud = {}; saveCloud(); break;
    case 'coachconnect': {
      const inp = document.getElementById('inp-coachkey');
      const key = inp && inp.value.trim();
      if (!key) { showToast('Paste an API key first'); return; }
      coach.key = key; saveCoach();
      break;
    }
    case 'coachdisconnect': coach = {}; saveCoach(); break;
    case 'coachbrief':
      navigator.clipboard.writeText(coachBrief())
        .then(() => showToast('Coach brief copied — paste it into Claude'))
        .catch(() => showToast('Copy failed — try again'));
      return;
    case 'chatclear': chat = []; saveChat(); break;
    case 'chatsend': coachSend(); return;
    case 'importmerge': applyImport('merge'); break;
    case 'importreplace': applyImport('replace'); break;
    case 'dialogclose': ui.dialog = null; ui.importData = null; break;
    case 'undo':
      if (ui.toast && ui.toast.undo) ui.toast.undo();
      ui.toast = null; clearTimeout(toastTimer);
      break;
  }
  render();
});

document.getElementById('frame').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'inp-chat') {
    e.preventDefault();
    coachSend();

/* ───────────────────────── Export / import ───────────────────────── */

function doExport() {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gym-tracker-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  showToast('Backup exported');
}

document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data.sessions !== 'object' || data.sessions === null) throw new Error('bad shape');
      ui.importData = data;
      ui.dialog = 'import';
      render();
    } catch (err) {
      showToast('Not a valid backup file');
    }
  };
  reader.readAsText(file);
});

/* — Coach chat: direct browser calls to the Claude API, streaming — */

function coachLogSummary() {
  return workoutDates().slice(-60).map((d) => {
    const s = store.sessions[d];
    const parts = Object.entries(s.sets).map(([id, sets]) => {
      const name = getEx(id).name;
      const reps = sets.map((x) => x.r).join('/');
      const kgs = [...new Set(sets.map((x) => x.kg))];
      const kgPart = kgs.length === 1 ? (kgs[0] == null ? 'BW' : kgs[0] + 'kg') : sets.map((x) => (x.kg == null ? 'BW' : x.kg)).join('/') + 'kg';
      return name + ' ' + reps + ' @ ' + kgPart;
    });
    return d + ' (' + s.day + '): ' + parts.join('; ');
  }).join('\n');
}

function coachSystemPrompt() {
  const planTxt = ['pull', 'push'].map((t) =>
    DAY_LABEL[t] + ': ' + PLAN[t].map((id) => EX[id].name + ' ' + EX[id].sets + '×' + EX[id].reps).join(', ')).join('\n');
  return 'You are the coach inside a personal gym-tracker app. The user trains at home with adjustable dumbbells, a pull-up bar, and an ottoman used as a bench — no barbell, no real bench, no machines.\n\n' +
    'Their program (push and pull alternate, with a rest day between when possible):\n' + planTxt + '\n\n' +
    'Today is ' + todayStr() + ' (' + weekdayName(todayStr()) + '); the app suggests a ' + DAY_LABEL[dayType(todayStr())].toLowerCase() + '.\n\n' +
    'Full workout log, oldest first (date (day): exercise reps @ weight; BW = bodyweight):\n' +
    (coachLogSummary() || 'No workouts logged yet.') + '\n\n' +
    'Be a concise, practical strength coach. Ground advice in the actual numbers from the log. Default progression: add reps until the top of the target range, then add weight (0.5–2 kg steps for dumbbells) and drop back to the bottom of the range. Use kg. Answer in plain text — no markdown headings, asterisks, or backticks; short paragraphs and simple dashes are fine. Keep answers brief unless asked for detail. For pain or possible injuries, err on the side of caution and recommend a professional for anything serious.';
}

/* A pasteable version of the coach context, for chatting on a claude.ai

function coachBrief() {

async function coachSend() {
  const inp = document.getElementById('inp-chat');
  const text = inp && inp.value.trim();
  if (!text || ui.coachBusy || !coach.key) return;
  chat.push({ role: 'user', text });
  saveChat();
  ui.coachBusy = true;
  render();

  const messages = chat.filter((m) => !m.err).map((m) => ({ role: m.role, content: m.text }));
  let reply = '', stopReason = null, errText = null;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': coach.key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: COACH_MODEL,
        max_tokens: 1024,
        stream: true,
        output_config: { effort: 'low' },
        system: [{ type: 'text', text: coachSystemPrompt(), cache_control: { type: 'ephemeral' } }],
        messages,
      }),
    });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).error.message; } catch (e) { /* no body */ }
      throw new Error(res.status === 401 ? 'API key rejected — disconnect and paste a fresh key' : (detail || 'HTTP ' + res.status));
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith('data:')) continue;
        let ev;
        try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }
        if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') {
          reply += ev.delta.text;
          const el = document.getElementById('coach-stream');
          if (el) {
            el.textContent = reply;
            el.style.color = 'var(--color-text)';
            const sc = document.getElementById('chat-scroll');
            if (sc) sc.scrollTop = sc.scrollHeight;
          }
        } else if (ev.type === 'message_delta' && ev.delta && ev.delta.stop_reason) {
          stopReason = ev.delta.stop_reason;
        } else if (ev.type === 'error') {
          errText = (ev.error && ev.error.message) || 'stream error';
        }
      }
    }
  } catch (e) {
    errText = e.message || 'network error';
  }
  ui.coachBusy = false;
  if (reply) chat.push({ role: 'assistant', text: reply + (stopReason === 'max_tokens' ? ' […]' : '') });
  else if (errText) chat.push({ role: 'assistant', text: '⚠ ' + errText, err: true });
  else if (stopReason === 'refusal') chat.push({ role: 'assistant', text: 'I can’t help with that one — try rephrasing.', err: true });
  else chat.push({ role: 'assistant', text: '⚠ Empty response — try again.', err: true });
  saveChat();
  render();
}

/* — Cloud backup: a private GitHub Gist holding gym-tracker-backup.json — */

const GIST_FILE = 'gym-tracker-backup.json';

async function gistApi(method, path, body) {
  const res = await fetch('https://api.github.com' + path, {
    method,
    headers: {
      'Authorization': 'Bearer ' + cloud.token,
      'Accept': 'application/vnd.github+json',
      ...(body ? { 'Content-Type': 'application/json' } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const hint = res.status === 401 ? 'token rejected' : res.status === 404 ? 'not found' : 'HTTP ' + res.status;
    throw new Error(hint);
  }
  return res.json();
}

/* Find this app's backup gist: the stored id if still valid, else search the
   account's gists for the backup filename (covers a fresh device). */
async function findBackupGist() {
  if (cloud.gistId) {
    try { return await gistApi('GET', '/gists/' + cloud.gistId); }
    catch (e) { cloud.gistId = null; saveCloud(); }
  }
  const list = await gistApi('GET', '/gists?per_page=100');
  const hit = list.find((g) => g.files && g.files[GIST_FILE]);
  return hit ? gistApi('GET', '/gists/' + hit.id) : null;
}

async function cloudSave() {
  showToast('Saving to cloud…');
  try {
    const files = { [GIST_FILE]: { content: JSON.stringify(store, null, 2) } };
    let gist = await findBackupGist();
    if (gist) {
      await gistApi('PATCH', '/gists/' + gist.id, { files });
      cloud.gistId = gist.id;
    } else {
      gist = await gistApi('POST', '/gists', { description: 'Gym Tracker backup', public: false, files });
      cloud.gistId = gist.id;
    }
    cloud.lastSync = new Date().toISOString();
    saveCloud();
    showToast('Backed up to cloud');
  } catch (e) {
    showToast('Cloud save failed — ' + e.message);
  }
}

async function cloudRestore() {
  showToast('Fetching cloud backup…');
  try {
    const gist = await findBackupGist();
    if (!gist) { showToast('No cloud backup found yet'); return; }
    cloud.gistId = gist.id; saveCloud();
    const file = gist.files[GIST_FILE];
    const text = file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
    const data = JSON.parse(text);
    if (!data || typeof data.sessions !== 'object' || data.sessions === null) throw new Error('bad backup shape');
    ui.importData = data;
    ui.dialog = 'import';
    ui.toast = null;
    render();
  } catch (e) {
    showToast('Cloud restore failed — ' + e.message);
  }
}

function applyImport(mode) {
  const data = ui.importData;
  if (!data) return;
  if (mode === 'replace') {
    store = { version: 1, sessions: data.sessions || {}, overrides: data.overrides || {}, customEx: data.customEx || {} };
  } else {
    Object.assign(store.sessions, data.sessions || {});
    Object.assign(store.overrides, data.overrides || {});
    Object.assign(store.customEx, data.customEx || {});
  }
  save();
  ui.dialog = null; ui.importData = null;
  showToast(mode === 'replace' ? 'Backup restored' : 'Backup merged');
}

/* ───────────────────────── Boot ───────────────────────── */

render();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
