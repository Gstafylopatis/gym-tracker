<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="description" content="Personal workout tracker">
<meta name="theme-color" content="#0e0f11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    var t = (JSON.parse(localStorage.getItem('gym-tracker-prefs')) || {}).theme;
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div id="frame">
  <div id="app"></div>
  <div id="timer" hidden></div>
  <div id="overlay"></div>
  <nav id="nav" aria-label="Main"></nav>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>
<noscript>Gym Tracker needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
